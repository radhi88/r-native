# live_micro_disabled.yaml
# ========================
# Template for live micro-lot trading.
# This file is DISABLED. All flags below prevent execution.
#
# DO NOT activate until:
#   1. dry_run_runner.py passes >= 100 cycles without error
#   2. All Phase 16 verification scans confirm clean architecture
#   3. Risk parameters reviewed and signed off
#   4. Demo account tested with GovernorAgent for >= 48 hours
#   5. kill_switch explicitly set to false after sign-off
#
# To activate (dangerous): copy fields to trading_runtime.yaml and set:
#   mode: DEMO  (never LIVE without further review)
#   allow_live_trading: false  (keep false until explicitly cleared)
#   kill_switch: false  (only after full demo test pass)

runtime:
  mode: DRY_RUN
  allow_live_trading: false
  kill_switch: true

risk:
  max_lot: 0.01                # micro lot only — hard limit
  max_open_positions: 1        # one position at a time
  max_trades_per_day: 3
  max_daily_drawdown: 0.5      # 0.5% account equity max daily loss
  min_confidence: 0.72
  max_spread_points: 25.0
  allow_grid: false
  allow_hedge: false
  allow_martingale: false
  allow_news_trading: false

execution:
  deviation_points: 20
  retry_on_requote: true
  dry_run_fallback: true       # fall back to DRY_RUN if MT5 not connected
  one_execution_path_only: true
  require_risk_approval: true
  require_conflict_guard: true

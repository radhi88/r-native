<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep cosmic background — radial fade -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="55%"  stop-color="#0a0820"/>
      <stop offset="100%" stop-color="#020107"/>
    </radialGradient>

    <!-- Bull body: dark→neon green -->
    <linearGradient id="bull" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#065f46"/>
      <stop offset="50%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Bear body: dark→neon red -->
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7f1d1d"/>
      <stop offset="50%"  stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>

    <!-- Luxury gold for the bowl (4-stop, hand-tuned warm metallic) -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fef3c7"/>
      <stop offset="38%"  stop-color="#fbbf24"/>
      <stop offset="78%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Violet→gold ring gradient (unexpected premium palette) -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- PULSING CORE GLOW (gold→violet, breathes 2.8s) -->
    <radialGradient id="pulseCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9">
        <animate attributeName="stop-opacity"
                 values="0.35;0.95;0.35" dur="2.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.4">
        <animate attributeName="stop-opacity"
                 values="0.10;0.55;0.10" dur="2.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- RING PULSE (slow halo expansion, 4.2s — gives "breathing" feel) -->
    <radialGradient id="haloPulse" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#fbbf24" stop-opacity="0">
        <animate attributeName="stop-opacity"
                 values="0;0.35;0" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ────────── 1. BACKGROUND DISC ────────── -->
  <circle cx="100" cy="100" r="94" fill="url(#bg)"/>

  <!-- Pulsing halo (just inside the rim) -->
  <circle cx="100" cy="100" r="94" fill="url(#haloPulse)"/>

  <!-- Premium ring frame (violet→gold) -->
  <circle cx="100" cy="100" r="94" fill="none"
          stroke="url(#ring)" stroke-width="1.8" opacity="0.95"/>
  <!-- Inner hairline (depth) -->
  <circle cx="100" cy="100" r="89" fill="none"
          stroke="#fbbf24" stroke-width="0.4" opacity="0.35"/>

  <!-- ────────── 2. PULSING CORE GLOW (behind R) ────────── -->
  <circle cx="100" cy="100" r="72" fill="url(#pulseCore)"/>

  <!-- ────────── 3. FIBONACCI RETRACEMENT GRID (very faint) ────────── -->
  <g opacity="0.14" stroke="#fbbf24" stroke-width="0.35">
    <line x1="32" y1="60"  x2="168" y2="60"/>
    <line x1="32" y1="76"  x2="168" y2="76"/>
    <line x1="32" y1="92"  x2="168" y2="92"/>
    <line x1="32" y1="108" x2="168" y2="108"/>
    <line x1="32" y1="124" x2="168" y2="124"/>
    <line x1="32" y1="140" x2="168" y2="140"/>
  </g>

  <!-- ────────── 4. KEY PRICE LEVELS (.618 mid + support) ────────── -->
  <!-- Golden zone (.618 retracement) — through center -->
  <line x1="22" y1="100" x2="178" y2="100"
        stroke="#fbbf24" stroke-width="0.7"
        stroke-dasharray="2,3" opacity="0.50"/>
  <!-- Support — bottom -->
  <line x1="22" y1="160" x2="178" y2="160"
        stroke="#10b981" stroke-width="0.9"
        stroke-dasharray="5,3" opacity="0.65"/>

  <!-- ────────── 4b. TOP RESISTANCE = STAIRCASE OF FALLING BEAR CANDLES ────────── -->
  <!-- A sequence of 7 red bear candles descending — visual "lower highs / sell-off" pattern -->
  <!-- Each candle: thin wick line + small filled body. Heights staircase down right-to-left -->
  <g opacity="0.88">
    <!-- Candle 1 (leftmost, lowest top — start of move) -->
    <line x1="28" y1="42" x2="28" y2="56" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="25.5" y="46" width="5" height="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 2 -->
    <line x1="42" y1="38" x2="42" y2="54" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="39.5" y="42" width="5" height="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 3 — peak (highest high before reversal) -->
    <line x1="56" y1="32" x2="56" y2="52" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="53.5" y="36" width="5" height="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 4 — turning point -->
    <line x1="115" y1="34" x2="115" y2="54" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="112.5" y="38" width="5" height="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 5 (LH = lower high) -->
    <line x1="130" y1="38" x2="130" y2="56" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="127.5" y="42" width="5" height="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 6 (LH lower) -->
    <line x1="145" y1="42" x2="145" y2="58" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="142.5" y="46" width="5" height="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Candle 7 (rightmost, lowest — sell-off continues) -->
    <line x1="160" y1="46" x2="160" y2="60" stroke="#ef4444" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="157.5" y="50" width="5" height="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.3"/>

    <!-- Connecting trendline (lower-highs line) — subtle dashed -->
    <line x1="56" y1="36" x2="160" y2="50"
          stroke="#ef4444" stroke-width="0.5"
          stroke-dasharray="2,2" opacity="0.55"/>
  </g>

  <!-- ────────── 5. THE R — BULL + GOLD + BEAR TRIPTYCH ────────── -->

  <!-- ▲ Upper wick of bull candle (extends above the body) -->
  <line x1="73" y1="38" x2="73" y2="52"
        stroke="#fbbf24" stroke-width="1.4" opacity="0.85"
        stroke-linecap="round"/>

  <!-- ▰ VERTICAL STROKE = GREEN BULL CANDLE (rising) -->
  <rect x="65" y="52" width="16" height="110" rx="2"
        fill="url(#bull)" stroke="#fbbf24" stroke-width="0.6"/>

  <!-- ▼ Lower wick of bull candle -->
  <line x1="73" y1="162" x2="73" y2="172"
        stroke="#fbbf24" stroke-width="1.4" opacity="0.85"
        stroke-linecap="round"/>

  <!-- ◯ BOWL OF R = LUXURY GOLD (the "profit" zone) -->
  <path d="M 65 52
           L 120 52
           Q 152 52 152 78
           Q 152 106 120 106
           L 81 106
           L 81 90
           L 116 90
           Q 132 90 132 78
           Q 132 64 116 64
           L 81 64
           Z"
        fill="url(#gold)" stroke="#fef3c7" stroke-width="0.5"/>

  <!-- ◢ DIAGONAL LEG = STAIRCASE OF FALLING BEAR CANDLES (lower-lows downtrend) -->
  <!-- The candles ARE the leg. A faint gold parallelogram behind unifies them so the R
       reads as a complete letter from a distance, and as a candle pattern up close. -->
  <g>
    <!-- Ghost leg outline (faint gold parallelogram — gives the eye the "R" shape) -->
    <path d="M 96 100
             L 156 162
             L 138 162
             L 82 104
             Z"
          fill="url(#gold)" opacity="0.18" stroke="#fbbf24"
          stroke-width="0.5" stroke-opacity="0.35"/>

    <!-- Trendline connecting the lower-highs (bear pattern hint) -->
    <line x1="98" y1="102" x2="156" y2="160"
          stroke="#ef4444" stroke-width="0.6"
          stroke-dasharray="2,2" opacity="0.55"/>

    <!-- ── 7 falling bear candles, packed along the diagonal ── -->
    <!-- Candle 1 — connects to bowl joint (top of leg) -->
    <line x1="99" y1="96"  x2="99"  y2="118" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="95" y="100" width="8" height="14" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 2 -->
    <line x1="109" y1="104" x2="109" y2="128" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="105" y="108" width="8" height="16" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 3 -->
    <line x1="119" y1="113" x2="119" y2="138" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="115" y="117" width="8" height="17" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 4 -->
    <line x1="129" y1="122" x2="129" y2="148" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="125" y="126" width="8" height="18" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 5 -->
    <line x1="139" y1="131" x2="139" y2="158" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="135" y="135" width="8" height="19" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 6 -->
    <line x1="149" y1="140" x2="149" y2="168" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>
    <rect x="145" y="144" width="8" height="20" fill="url(#bear)" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Candle 7 — capitulation (brightest, lowest, at R's lower-right corner) -->
    <line x1="158" y1="148" x2="158" y2="174" stroke="#fbbf24" stroke-width="1.0" opacity="0.95"/>
    <rect x="154" y="152" width="8" height="20" fill="url(#bear)" stroke="#fde047" stroke-width="0.7"/>
  </g>

  <!-- ────────── 6. ORBITING DATA POINT (animated 8s cycle) ────────── -->
  <g>
    <circle r="2.2" fill="#fbbf24">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 100 100" to="360 100 100"
                        dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="6;6" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="100;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Static position for the orbiting dot (placed at top, rotated by animateTransform) -->

  <!-- ────────── 7. BRAND MARK ────────── -->
  <text x="100" y="186" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="7" font-weight="700"
        fill="#fbbf24" letter-spacing="5"
        opacity="0.95">R · FACTORY</text>
</svg>

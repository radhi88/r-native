name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    # MetaTrader5 is Windows-only, so CI installs only what the tested modules need.
    - name: Install
      run: python -m pip install pytest numpy pandas
    - name: Employee link tests
      run: python -m pytest -q tests/test_employee_link.py

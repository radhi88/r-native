name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]   # الوقت التشغيليّ الفعليّ للأسطول (3.7/3.8 منتهيان)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # فحص نحويّ خالص بـPython — بلا قشرة bash (تفادياً لتفاعلات -e / الإيموجي في المسارات)،
    # وبلا تنصيب requirements.txt (فيه MetaTrader5 Windows-only لا يُنصَّب على Linux؛
    # py_compile لا يحتاج تبعيّات). حتميّ: غلوب stock_analyst + قائمة أدوات/محرّكات الجذر.
    - name: Byte-compile this project's Python files
      run: |
        python - <<'PY'
        import glob, os, py_compile, sys

        files = sorted(glob.glob("stock_analyst/**/*.py", recursive=True))
        files += [f for f in (
            "edge_governor.py", "fabio_orb.py", "why_no_trades.py",
            "watchdog_guard.py", "momentum_harvester.py", "nr7_prover.py",
            "orb_trader.py", "multi_trader.py", "radhi_mimic.py",
            "army_warroom.py", "boundary_pilot.py", "level_sentinel_multi.py",
            "profit_harvester.py",
        ) if os.path.isfile(f)]

        print(f"Python {sys.version.split()[0]} — checking {len(files)} file(s)")
        failed = []
        for f in files:
            try:
                py_compile.compile(f, doraise=True)
                print(f"  OK  {f}")
            except py_compile.PyCompileError as e:
                print(f"  ERR {f}\n{e}")
                failed.append(f)

        if failed:
            print(f"\n{len(failed)} file(s) failed to compile:")
            for f in failed:
                print(f"  - {f}")
            sys.exit(1)
        print(f"\nAll {len(files)} files compile cleanly.")
        PY

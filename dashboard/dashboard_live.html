<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRIDAY — السعر الحيّ XAUUSDm</title>
<style>
 :root{--bg:#0b0e14;--fg:#e6edf3;--dim:#8b949e;--g:#3fb950;--r:#f85149;--acc:#58a6ff;--card:#11151c}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Arial}
 .wrap{max-width:920px;margin:0 auto;padding:16px}
 h1{font-size:16px;color:var(--dim);font-weight:600;margin:6px 0 14px}
 .price{font-size:54px;font-weight:800;letter-spacing:-1px}
 .sub{color:var(--dim);font-size:14px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
 .card{background:var(--card);border:1px solid #1f2630;border-radius:12px;padding:12px}
 .card .k{color:var(--dim);font-size:12px}.card .v{font-size:20px;font-weight:700;margin-top:3px}
 canvas{width:100%;height:320px;background:var(--card);border:1px solid #1f2630;border-radius:12px;margin-top:6px}
 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--r);margin-inline-start:6px}
 .up{color:var(--g)}.down{color:var(--r)}
</style></head><body><div class="wrap">
 <h1>🟢 FRIDAY · السعر الحيّ XAUUSDm <span id="dot" class="dot"></span> <span id="ago" class="sub"></span></h1>
 <div><span id="price" class="price">—</span> <span id="spread" class="sub"></span></div>
 <div class="grid">
   <div class="card"><div class="k">Bid</div><div class="v" id="bid">—</div></div>
   <div class="card"><div class="k">Ask</div><div class="v" id="ask">—</div></div>
   <div class="card"><div class="k">الرصيد / الإكويتي</div><div class="v" id="acct">—</div></div>
   <div class="card"><div class="k">عائم السلة</div><div class="v" id="pnl">—</div></div>
 </div>
 <canvas id="chart"></canvas>
 <div class="sub" id="meta" style="margin-top:8px"></div>
</div>
<script>
const hist=[]; const MAX=180; let last=null, lastT=0;
const $=id=>document.getElementById(id);
function fmt(n){return (n==null||isNaN(n))?'—':Number(n).toFixed(2)}
async function tick(){
 try{
  const r=await fetch('/api/market',{cache:'no-store'}); const d=await r.json();
  const bid=+d.bid, ask=+d.ask, mid=(bid+ask)/2;
  const dir = last==null?'' : (mid>last?'up':mid<last?'down':'');
  $('price').textContent=fmt(mid); $('price').className='price '+dir;
  $('spread').textContent='سبريد '+fmt((ask-bid))+' · '+(d.account_server||'');
  $('bid').textContent=fmt(bid); $('bid').className='v down';
  $('ask').textContent=fmt(ask); $('ask').className='v up';
  $('acct').textContent='$'+fmt(d.balance)+' / $'+fmt(d.equity);
  const p=+d.basket_pnl||0; $('pnl').textContent='$'+fmt(p); $('pnl').className='v '+(p>=0?'up':'down');
  $('meta').textContent='H '+fmt(d.high)+'  L '+fmt(d.low)+'  · gen '+(d.generation??'-')+'  bar '+(d.bar??'-');
  $('dot').style.background='var(--g)'; lastT=Date.now(); last=mid;
  hist.push(mid); if(hist.length>MAX) hist.shift(); draw();
 }catch(e){ $('dot').style.background='var(--r)'; }
}
function draw(){
 const c=$('chart'), dpr=devicePixelRatio||1;
 c.width=c.clientWidth*dpr; c.height=c.clientHeight*dpr;
 const x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
 if(hist.length<2)return;
 const lo=Math.min(...hist), hi=Math.max(...hist), rng=(hi-lo)||1e-9;
 const W=c.width,H=c.height,pad=10*dpr;
 x.strokeStyle=hist[hist.length-1]>=hist[0]?'#3fb950':'#f85149'; x.lineWidth=2*dpr; x.beginPath();
 hist.forEach((v,i)=>{const px=pad+(W-2*pad)*i/(hist.length-1), py=pad+(H-2*pad)*(1-(v-lo)/rng); i?x.lineTo(px,py):x.moveTo(px,py);});
 x.stroke();
 x.fillStyle='#8b949e';x.font=(12*dpr)+'px system-ui';x.textAlign='left';
 x.fillText(hi.toFixed(2),pad,pad+12*dpr); x.fillText(lo.toFixed(2),pad,H-pad);
}
setInterval(()=>{ $('ago').textContent=lastT?('آخر تحديث منذ '+Math.round((Date.now()-lastT)/1000)+'ث'):''; },1000);
tick(); setInterval(tick,1000);
</script></body></html>
